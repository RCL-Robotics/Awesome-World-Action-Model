name: Correct an entry
description: Report incorrect metadata, classification, duplicates, or broken links.
title: '[Correction] '
body:
  - type: input
    id: paper
    attributes:
      label: Paper URL
      description: Provide the arXiv, DOI, publisher, PDF, or other paper source URL so we can identify the entry. arXiv is not required.
    validations:
      required: true
  - type: dropdown
    id: field
    attributes:
      label: What needs correction?
      options:
        - Bibliographic metadata
        - Classification or research topic
        - Contribution or abstract
        - Broken or missing link
        - Duplicate or out of scope
        - Other
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
      description: Describe the current and corrected values and name the affected field. Distinguish major category, subcategories, architecture, prediction paradigm, quadrant, classification status, and original research topics. Missing information can remain blank; do not force entries into Q1–Q4.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Source
      description: Link to the paper, author page, or official project supporting the correction. Do not copy private file paths, internal classification evidence, or retrieval logs.
    validations:
      required: true
