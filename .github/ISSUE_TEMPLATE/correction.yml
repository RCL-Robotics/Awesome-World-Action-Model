name: Correct an entry / 条目纠错
description: Report incorrect metadata, classification, duplicates, or broken links.
title: '[Correction] '
body:
  - type: input
    id: paper
    attributes:
      label: Paper URL / 论文链接
      description: Provide the arXiv, DOI, publisher, PDF, or other paper source URL so we can identify the entry. arXiv is not required.
    validations:
      required: true
  - type: dropdown
    id: field
    attributes:
      label: What needs correction? / 问题类型
      options:
        - Metadata / 标题、作者、机构、日期、年份或引用
        - Classification / 分类
        - Contribution or abstract / 贡献或摘要
        - Broken or missing link / 链接失效或缺失
        - Duplicate or out of scope / 重复或不符合收录范围
        - Other / 其他
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction / 建议修改
      description: Describe the current and corrected values. Missing abstracts, categories, and submission dates are allowed; add them only with a source. For a category change, suggest a primary or secondary research category.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Source / 依据
      description: Link to the paper, author page, or official project supporting the correction.
    validations:
      required: true
