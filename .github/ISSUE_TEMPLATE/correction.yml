name: Correct an entry / 条目纠错
description: Report incorrect metadata, classification, duplicates, or broken links.
title: '[Correction] '
body:
  - type: input
    id: paper
    attributes:
      label: Paper URL / 论文链接
      description: Provide the arXiv URL or the entry's website URL so we can identify the paper.
    validations:
      required: true
  - type: dropdown
    id: field
    attributes:
      label: What needs correction? / 问题类型
      options:
        - Metadata / 标题、作者、机构、日期
        - Classification / 分类
        - Contribution or abstract / 贡献或摘要
        - Broken or missing link / 链接失效或缺失
        - Duplicate or out of scope / 重复或不符合收录范围
        - Other / 其他
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction / 建议修改
      description: Describe the current value and the corrected value. For a category change, include the proposed primary or secondary category.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Source / 依据
      description: Link to the paper, author page, or official project supporting the correction.
    validations:
      required: true
