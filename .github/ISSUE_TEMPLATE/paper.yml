name: Recommend a paper / 推荐论文
description: Suggest a paper for the World Action Model catalog.
title: '[Paper] '
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contributing. Search the catalog and open issues first to avoid duplicates.
        请先搜索网站和已有 Issue。维护者确认后会在 Notion 中收录，再同步到网站和 README。
  - type: input
    id: title
    attributes:
      label: Paper title / 论文标题
      placeholder: Full paper title
    validations:
      required: true
  - type: input
    id: arxiv
    attributes:
      label: arXiv URL
      description: Link to the abstract page, e.g. https://arxiv.org/abs/2605.00001.
      placeholder: https://arxiv.org/abs/...
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Primary category / 主分类
      options:
        - General WAM
        - Memory WAM
        - WAM + RL
        - 3D/4D WAM
        - Latent / Representation WAM
        - Multimodal / Tactile WAM
        - Navigation / Driving / Domain WAM
        - Real-Time / Efficient WAM
        - Evaluation / Survey / Theory
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: Contribution and relevance / 贡献与相关性
      description: Explain the paper's contribution and how it connects world modeling with action, planning, or embodied behavior.
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: Code or project URL / 代码或项目地址
      description: Optional; use an author-provided link when available.
  - type: textarea
    id: details
    attributes:
      label: Additional details / 补充信息
      description: Authors, institutions, publication date, suggested secondary categories, or other useful context.
