name: Recommend a paper / 推荐论文
description: Suggest a paper for the World Action Model catalog.
title: '[Paper] '
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contributing. Search the catalog and open issues first to avoid duplicates.
        请先搜索本地目录和已有 Issue。仓库保持私有；维护者确认后会在 Notion 中收录，再同步到本地网站数据和 README。
        arXiv、DOI、出版方论文页和论文 PDF 等来源均可。摘要、分类和提交日期暂缺不会阻止收录。
  - type: input
    id: title
    attributes:
      label: Paper title / 论文标题
      placeholder: Full paper title
    validations:
      required: true
  - type: input
    id: authors
    attributes:
      label: Authors / 作者
      description: Copy the author names from the paper or its source page.
    validations:
      required: true
  - type: input
    id: paper
    attributes:
      label: Paper source URL / 论文来源链接
      description: Provide an arXiv, DOI, publisher, PDF, or other URL identifying this paper. arXiv is not required.
      placeholder: https://doi.org/… or https://arxiv.org/abs/…
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Suggested primary category / 建议主分类
      description: Optional. Leave blank or choose Uncategorized if classification is pending; the catalog retains nine research directions.
      options:
        - Uncategorized
        - General WAM
        - Memory WAM
        - WAM + RL
        - 3D/4D WAM
        - Latent / Representation WAM
        - Multimodal / Tactile WAM
        - Navigation / Driving / Domain WAM
        - Real-Time / Efficient WAM
        - Evaluation / Survey / Theory
    validations:
      required: false
  - type: textarea
    id: contribution
    attributes:
      label: Contribution and relevance / 贡献与相关性
      description: Optional. Explain the paper's contribution and how it connects world modeling with action, planning, or embodied behavior, if known.
    validations:
      required: false
  - type: input
    id: code
    attributes:
      label: Code or project URL / 代码或项目地址
      description: Optional; use an author-provided link when available.
  - type: textarea
    id: details
    attributes:
      label: Additional details / 补充信息
      description: Optional. Institutions, an explicitly recorded publication year or submission date, abstract, PDF/DOI links, existing BibTeX, or suggested secondary categories. Leave unknown information blank.
