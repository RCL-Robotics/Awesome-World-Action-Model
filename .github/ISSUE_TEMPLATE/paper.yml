name: Recommend a paper
description: Suggest a paper for the World Action Model catalog.
title: '[Paper] '
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contributing. Search the catalog and open issues first to avoid duplicates.
        Maintainers review suggestions in Notion, then update the catalog and README for the next website release.
        arXiv, DOI, publisher pages, and paper PDFs are all accepted sources. Missing abstracts, classifications, or submission dates do not prevent inclusion.
  - type: input
    id: title
    attributes:
      label: Paper title
      placeholder: Full paper title
    validations:
      required: true
  - type: input
    id: authors
    attributes:
      label: Authors
      description: Copy the author names from the paper or its source page.
    validations:
      required: true
  - type: input
    id: paper
    attributes:
      label: Paper source URL
      description: Provide an arXiv, DOI, publisher, PDF, or other URL identifying this paper. arXiv is not required.
      placeholder: https://doi.org/… or https://arxiv.org/abs/…
    validations:
      required: true
  - type: input
    id: major
    attributes:
      label: Suggested major category
      description: Optional. Use a major category from the research map; this is separate from the original research-topic fields.
  - type: input
    id: subcategories
    attributes:
      label: Suggested subcategories
      description: Optional. Describe the entry's more specific contribution or roles within the major category.
  - type: textarea
    id: contribution
    attributes:
      label: Contribution and relevance
      description: Optional. Explain the paper's contribution and how it connects world modeling with action, planning, or embodied behavior, if known.
    validations:
      required: false
  - type: input
    id: code
    attributes:
      label: Code or project URL
      description: Optional; use an author-provided link when available.
  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Optional. Institutions, recorded publication year or submission date, abstract, PDF/DOI links, or existing BibTeX. Architecture, prediction paradigm, or quadrant suggestions should cite a research source. Leave unknown information blank and omit private audit paths or retrieval logs.
